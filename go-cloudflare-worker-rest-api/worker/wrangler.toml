# Wrangler is Cloudflare's CLI for building and deploying Workers.
# This file tells it what to deploy and how.

name = "books-worker"                 # becomes books-worker.<your-subdomain>.workers.dev
main = "./build/worker.mjs"           # the JS shim that boots our WASM (generated by the build)
compatibility_date = "2025-01-01"     # pins Worker runtime behavior; bump deliberately

# The build command the syumai/workers template wires up. It (1) generates the JS
# glue + wasm_exec.js, then (2) compiles Go to WASM. Swap the second line for
# `tinygo build -o ./build/app.wasm -target wasm .` to shrink the binary for the
# free plan.
[build]
command = "go run github.com/syumai/workers/cmd/workers-assets-gen -mode=go && GOOS=js GOARCH=wasm go build -o ./build/app.wasm ."

# OPTIONAL — cap CPU per request so a runaway loop can't run up a bill on the
# paid plan. Free plan is already hard-capped at 10ms.
# [limits]
# cpu_ms = 50

# OPTIONAL — a Workers KV namespace for durable storage. Create it with:
#   npx wrangler kv namespace create BOOKS
# then paste the id below and read it in Go via the workers/cloudflare/kv package.
# [[kv_namespaces]]
# binding = "BOOKS"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
